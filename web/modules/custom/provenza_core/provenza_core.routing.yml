    _title: 'Preguntas frecuentes'
    bundle: faq
  requirements:
    _access: 'TRUE'

provenza_core.documentos:
  path: '/comunidad/documentos'
  defaults:
    _controller: '\Drupal\provenza_core\Controller\PortalController::listing'
    _title: 'Documentos y reglamento'
    bundle: documento
  requirements:
    _access: 'TRUE'

provenza_core.actas:
  path: '/comunidad/actas'
  defaults:
    _controller: '\Drupal\provenza_core\Controller\PortalController::listing'
    _title: 'Actas de asamblea'
    bundle: documento
  requirements:
    _access: 'TRUE'

provenza_core.directorio:
  path: '/comunidad/directorio'
  defaults:
    _controller: '\Drupal\provenza_core\Controller\PortalController::listing'
    _title: 'Directorio'
    bundle: directorio
  requirements:
    _access: 'TRUE'

provenza_core.instalaciones:
  path: '/instalaciones'
  defaults:
    _controller: '\Drupal\provenza_core\Controller\PortalController::listing'
    _title: 'Instalaciones'
    bundle: instalacion
  requirements:
    _access: 'TRUE'

provenza_core.eventos:
  path: '/comunidad/calendario'
  defaults:
    _controller: '\Drupal\provenza_core\Controller\PortalController::listing'
    _title: 'Calendario de eventos'
    bundle: evento
  requirements:
    _access: 'TRUE'

provenza_core.tutorial:
